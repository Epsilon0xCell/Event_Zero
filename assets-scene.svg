<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Inside the loft looking up: dew on a web, bee frames waggling, ant trails, moth wings, dragonfly wings and a race ring drifting home">
<rect width="1200" height="340" fill="#e9eef0"/>
<rect y="250" width="1200" height="90" fill="#7a5630"/>
<g id="far-web" stroke="#b9c4c6" fill="none"><path d="M100 20 L420 90 M420 20 L100 90 M260 0 L260 110"/></g>
<g id="far-dew"><circle cx="180" cy="42" r="4" fill="#cfe6f2"><animate attributeName="r" values="3;6;6" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="42;42;48" dur="6s" repeatCount="indefinite"/></circle><circle cx="330" cy="66" r="4" fill="#cfe6f2"><animate attributeName="r" values="3;6;6" dur="7s" begin="1s" repeatCount="indefinite"/></circle></g>
<g id="far-specks" fill="#4a545c"><circle r="3"><animateMotion path="M1000 60 a60 22 0 1 1 -0.1 0" dur="16s" repeatCount="indefinite"/></circle><circle r="2.4"><animateMotion path="M1060 84 a44 16 0 1 0 -0.1 0" dur="13s" repeatCount="indefinite"/></circle></g>
<g id="mid-beeframe"><g><animateMotion path="M300 190 c60 -44 120 44 180 0 c-60 -44 -120 44 -180 0" dur="9s" repeatCount="indefinite"/><rect x="-34" y="-22" width="68" height="44" fill="none" stroke="#d8a434" stroke-width="5"/><line x1="-34" y1="0" x2="34" y2="0" stroke="#d8a434" stroke-width="3"/></g></g>
<g id="mid-ants" fill="#568c3e"><circle r="3.4"><animateMotion path="M120 268 H560" dur="4.5s" repeatCount="indefinite"/></circle><circle r="3"><animateMotion path="M140 268 H580" dur="4.5s" begin="0.35s" repeatCount="indefinite"/></circle><circle r="2.6"><animateMotion path="M160 268 H600" dur="4.5s" begin="0.7s" repeatCount="indefinite"/></circle></g>
<g id="mid-moth"><g transform="translate(760 170)"><path d="M0 0 q-34 -22 -44 4 q30 10 44 -4" fill="#cfc4a8"><animateTransform attributeName="transform" type="scale" values="1 1;1 0.35;1 1" dur="3.4s" repeatCount="indefinite"/></path><path d="M0 0 q34 -22 44 4 q-30 10 -44 -4" fill="#ddd2b4"><animateTransform attributeName="transform" type="scale" values="1 1;1 0.35;1 1" dur="3.4s" repeatCount="indefinite"/></path><ellipse rx="5" ry="12" fill="#8a7a56"/></g></g>
<g id="near-dragonfly"><g opacity="0.75"><animateTransform attributeName="transform" type="translate" values="-120 120;1260 60" dur="17s" repeatCount="indefinite"/><ellipse cx="-26" cy="0" rx="34" ry="8" fill="#dceef5"/><ellipse cx="26" cy="0" rx="34" ry="8" fill="#dceef5"/><ellipse rx="7" ry="20" fill="#7a9a4a"/></g></g>
<g id="near-ring"><g><animateMotion path="M80 300 L340 262 L620 302 L900 258 L1140 296" dur="15s" repeatCount="indefinite"/><ellipse rx="34" ry="19" fill="#d8a434"/><ellipse rx="17" ry="9" fill="#543818"/></g></g>
</svg>