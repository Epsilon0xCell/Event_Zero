name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cloudflare WARP VPN: route all host traffic in this job
      # (pip installs, test run) through Cloudflare WARP. Free WARP
      # egress mode: no secrets or Zero Trust org are needed.
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
      - name: Verify WARP is on
        run: |
          curl -s --retry 3 https://www.cloudflare.com/cdn-cgi/trace/ || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest unicorn
      - run: python -m pytest tests/ -q
