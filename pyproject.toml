[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "event-zero"
version = "3.0.0"
description = "State of the art offline malware analysis in plain English: proof-backed verdicts on whether a file is exactly what it claims to be"
requires-python = ">=3.10"
dependencies = ["lief>=0.14", "capstone>=5.0", "pefile>=2024.8.26", "pyelftools>=0.30"]
[project.optional-dependencies]
dev = ["pytest>=8"]
full = ["unicorn>=2.0", "google-genai>=1.0", "cryptography>=42"]
[project.scripts]
event_zero = "event_zero.cli:main"
[tool.setuptools.packages.find]
include = ["event_zero*"]
