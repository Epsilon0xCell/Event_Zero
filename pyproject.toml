[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "event-zero"
version = "2.0.0"
description = "Offline malware analysis into plain English"
requires-python = ">=3.10"
dependencies = ["lief>=0.14", "capstone>=5.0", "pefile>=2024.8.26", "pyelftools>=0.30"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
event_zero = "event_zero.cli:main"
[tool.setuptools.packages.find]
include = ["event_zero*"]
